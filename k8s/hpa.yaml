apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudguard-hpa
  namespace: cloudguard-system
  labels:
    app.kubernetes.io/name: cloudguard-analyzer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudguard-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
