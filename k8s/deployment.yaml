apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-deployment
  namespace: cloudguard-system
  labels:
    app.kubernetes.io/name: cloudguard-analyzer
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devsecops-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudguard-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudguard-analyzer
    spec:
      serviceAccountName: cloudguard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudguard-analyzer
          image: ghcr.io/devsecops/cloudguard-analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-streamlit
              containerPort: 8501
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          envFrom:
            - configMapRef:
                name: cloudguard-config
            - secretRef:
                name: cloudguard-credentials
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/.streamlit
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
