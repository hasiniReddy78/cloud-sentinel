apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudguard-config
  namespace: cloudguard-system
  labels:
    app.kubernetes.io/name: cloudguard-analyzer
data:
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_THEME_BASE: "dark"
  ANOMALY_CONTAMINATION_RATE: "0.05"
  DEFAULT_LOG_PROVIDER: "aws_cloudtrail"
  LOG_LEVEL: "INFO"
  ENABLE_SYNTHETIC_SIMULATOR: "true"
