apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudguard-sa
  namespace: cloudguard-system
  labels:
    app.kubernetes.io/name: cloudguard-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudguard-role
  namespace: cloudguard-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudguard-rolebinding
  namespace: cloudguard-system
subjects:
  - kind: ServiceAccount
    name: cloudguard-sa
    namespace: cloudguard-system
roleRef:
  kind: Role
  name: cloudguard-role
  apiGroup: rbac.authorization.k8s.io
